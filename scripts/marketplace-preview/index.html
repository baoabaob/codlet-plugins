<!doctype html>
<html lang="zh" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codlet · 插件市场设计预览</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color-scheme:light;color:#1b1b1b;background:#fff;--host-sidebar:#f7f7f7;--host-hover:#ececec;--host-border:#eee;--color-surface:#fff;--color-text:#1b1b1b;--color-text-secondary:#777;--color-border:#eee;--color-border-primary-outline:rgba(0,0,0,.16);--color-background-page-search:#fff;--thread-content-max-width:48rem;--padding-panel:20px;--color-chart-blue:#ff7835;--color-control-thumb-on-accent:white;--color-ring:#e9772d;--color-text-warning:#aa7600}
:root[data-theme=dark]{color-scheme:dark;color:#eee;background:#181818;--host-sidebar:#202020;--host-hover:#303030;--host-border:#303030;--color-surface:#181818;--color-text:#eee;--color-text-secondary:#aaa;--color-border:#303030;--color-border-primary-outline:rgba(255,255,255,.25);--color-background-page-search:#303030;--color-text-warning:#e8b63e}
*{box-sizing:border-box}body{font-size:14px;margin:0;height:100dvh;display:grid;grid-template-rows:36px minmax(0,1fr) auto}button,select{font:inherit}.preview-header{font-size:12px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--host-border);gap:16px;color:var(--color-text-secondary)}
.preview-shell{display:grid;grid-template-columns:192px minmax(0,1fr);min-height:0}.preview-sidebar{padding:16px 8px;background:var(--host-sidebar)}.preview-nav-button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:inherit;text-align:left}.preview-nav-button[aria-current=page]{background:var(--host-hover)}.preview-title{font-size:16px;font-weight:600;padding:0 12px 16px}.preview-main{display:flex;flex-direction:column;min-height:0;overflow:hidden}#native-toolbar{flex:0 0 46px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--host-border)}#native-toolbar>div{width:100%}#main{flex:1;min-height:0;overflow:hidden}
.preview-footer{border-top:1px solid var(--host-border);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 12px;font-size:12px;background:var(--color-surface)}.preview-footer label{display:flex;align-items:center;gap:6px}.preview-footer select,.preview-footer button{color:inherit;background:var(--color-surface);border:1px solid var(--host-border);border-radius:6px;padding:3px 6px}.preview-note{color:var(--color-text-secondary);margin-left:auto;min-width:0;max-width:480px}#preview-error{color:#b4534b} .preview-nav-button span{font-size:18px;width:18px;text-align:center}
@media(max-width:760px){.preview-shell{grid-template-columns:140px minmax(0,1fr)}.preview-header{font-size:11px}.preview-note{margin-left:0}}@media(max-width:560px){.preview-shell{grid-template-columns:minmax(0,1fr)}.preview-sidebar{display:none}.preview-header{padding-inline:10px}.preview-header span:nth-child(2){display:none}.preview-footer{gap:8px;font-size:11px}#native-toolbar{padding-inline:6px}}
</style></head><body>
<header class="preview-header"><span>Codlet · 插件市场交互预览</span><span>条目为演示数据 · 不会执行真实安装</span><span id="preview-error" role="alert"></span></header>
<div class="preview-shell"><aside class="preview-sidebar"><div class="preview-title">Codex⌄</div><nav aria-label="主导航"><button class="preview-nav-button"><span>＋</span>新对话</button><button class="preview-nav-button"><span>◷</span>定时任务</button></nav></aside><main class="preview-main"><div id="native-toolbar"></div><div id="main"></div></main></div>
<footer class="preview-footer" aria-label="设计预览控制"><label>外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>设备<select id="device"><option value="windows-x86_64">Windows x64</option><option value="windows-aarch64">Windows ARM64</option><option value="macos-aarch64">macOS Apple Silicon</option></select></label><label>市场状态<select id="scenario"><option value="normal">正常</option><option value="loading">加载中</option><option value="empty">无结果</option><option value="error">加载失败</option></select></label><button id="reset">回到入口</button><span class="preview-note" id="preview-message" role="status">可以点击“添加 → 插件市场”，再查看详情或体验安装流程</span></footer>
<script type="module">
const main=document.getElementById('main'),nav=document.querySelector('nav'),params=new URLSearchParams(location.search);
const [uiSource,guiSource]=await Promise.all(['/sdk/ui.js','/preview/renderer.js'].map(url=>fetch(url).then(r=>{if(!r.ok)throw Error('Preview resource unavailable');return r.text();})));
const createUI=(0,eval)(uiSource),module={exports:{}};new Function('module','exports',guiSource)(module,module.exports);
const cleanups=new Set();
const context={pluginId:'codlet-gui',generation:1,onDeactivate(fn){cleanups.add(fn);return()=>cleanups.delete(fn);},reportDiagnostic(error){document.getElementById('preview-error').textContent=error.message;},rpc:{request:async(cap,method,args)=>{
  if(cap.name==='codex.ui.navigation.page'&&method==='register'){
    const entry=document.createElement('button');entry.className='preview-nav-button';entry.id='codlet';entry.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.089 5.03755C16.6389 5.00078 16.0566 5 15.2 5H6.24999C5.55962 5 5 5.55963 5 6.24997L5.00001 7.53544C6.69615 7.77806 8.00001 9.23676 8.00001 11C8.00001 12.7632 6.69615 14.2219 5 14.4646L5 15.75C5 16.4404 5.55964 17 6.25 17L9.00001 17C9.82843 17 10.5 17.6716 10.5 18.5C10.5 19.3284 11.1716 20 12 20C12.8284 20 13.5 19.3284 13.5 18.5C13.5 17.6716 14.1716 17 15 17H17.25C18.2165 17 19 16.2165 19 15.25V8.8C19 7.94342 18.9992 7.36113 18.9624 6.91104C18.9266 6.47262 18.8617 6.24842 18.782 6.09202C18.5903 5.7157 18.2843 5.40973 17.908 5.21799C17.7516 5.1383 17.5274 5.07337 17.089 5.03755ZM17.2518 3.04419C17.8139 3.09012 18.3306 3.18868 18.816 3.43597C19.5686 3.81947 20.1805 4.43139 20.564 5.18404C20.8113 5.66937 20.9099 6.18608 20.9558 6.74817C21 7.28936 21 7.95372 21 8.75868V15.25C21 17.3211 19.3211 19 17.25 19H15.4646C15.2219 20.6961 13.7632 22 12 22C10.2368 22 8.77807 20.6961 8.53545 19L6.25 19C4.45507 19 2.99999 17.5449 3 15.75L3.00001 14C3.00001 13.1716 3.67158 12.5 4.50001 12.5C5.32843 12.5 6.00001 11.8284 6.00001 11C6.00001 10.1716 5.32843 9.5 4.50001 9.5C3.6756 9.5 3.00001 8.83398 3.00001 8.00154L3 6.24998C2.99999 4.45504 4.45508 3 6.24999 3L15.2413 3C16.0463 2.99999 16.7106 2.99998 17.2518 3.04419Z"/></svg>Codlet';entry.setAttribute('aria-current','page');nav.append(entry);
    entry.onclick=()=>document.dispatchEvent(new CustomEvent('market-preview-control',{detail:{reset:true}}));
    const slot=document.createElement('div');slot.dataset.codletPageToolbar=args.token;document.getElementById('native-toolbar').append(slot);
    const page=document.createElement('div');page.style.height='100%';page.dataset.codletPageHost=args.token;main.append(page);return {api:1,token:args.token,path:'/codlet/codlet-gui'};
  }
  if(cap.name==='codex.ui.navigation.page'&&method==='unregister')return {unregistered:true};
  throw Error('This preview has no live Core connection');
}}};context.ui={api:2,create:()=>createUI(context)};
document.getElementById('theme').value=params.get('theme')||'light';document.documentElement.dataset.theme=document.getElementById('theme').value;
document.getElementById('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
for(const key of ['device','scenario'])document.getElementById(key).onchange=e=>document.dispatchEvent(new CustomEvent('market-preview-control',{detail:{[key]:e.target.value}}));
document.getElementById('reset').onclick=()=>document.dispatchEvent(new CustomEvent('market-preview-control',{detail:{reset:true}}));
document.addEventListener('market-preview-message',event=>document.getElementById('preview-message').textContent=event.detail);
document.addEventListener('market-preview-state',event=>{for(const key of ['scenario','device'])document.getElementById(key).value=event.detail[key];});
try{await module.exports.activate(context);}catch(error){document.getElementById('preview-error').textContent=String(error.message);}
</script></body></html>
